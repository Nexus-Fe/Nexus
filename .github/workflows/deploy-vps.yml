name: Deploy frontend to VPS

on:
  workflow_dispatch:
    inputs:
      image_sha:
        description: Full Git commit SHA of a published frontend image
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: frontend-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Check image SHA and required configuration
        env:
          IMAGE_SHA: ${{ inputs.image_sha }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          GHCR_READ_USER: ${{ secrets.GHCR_READ_USER }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          API_GATEWAY_URL: ${{ vars.API_GATEWAY_URL }}
        run: |
          [[ "$IMAGE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Enter a full 40-character Git SHA."; exit 1; }
          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_KNOWN_HOSTS GHCR_READ_USER GHCR_READ_TOKEN API_GATEWAY_URL; do
            [[ -n "${!name}" ]] || { echo "Missing $name in the production environment."; exit 1; }
          done
          [[ "$API_GATEWAY_URL" == https://* || "$API_GATEWAY_URL" == http://* ]] || { echo "API_GATEWAY_URL must be an HTTP(S) URL."; exit 1; }
          [[ "$API_GATEWAY_URL" != *$'\n'* && "$API_GATEWAY_URL" != *$'\r'* ]] || { echo "API_GATEWAY_URL must be one line."; exit 1; }
          [[ "$GHCR_READ_USER" =~ ^[A-Za-z0-9_-]+$ ]] || { echo "Invalid GHCR_READ_USER."; exit 1; }
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Copy Compose file and deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT || '22' }}
          GHCR_READ_USER: ${{ secrets.GHCR_READ_USER }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          API_GATEWAY_URL: ${{ vars.API_GATEWAY_URL }}
          IMAGE_SHA: ${{ inputs.image_sha }}
        run: |
          set -euo pipefail
          target="${VPS_USER}@${VPS_HOST}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${IMAGE_SHA}"
          ssh -p "$VPS_PORT" "$target" 'mkdir -p ~/nexus-fe && chmod 700 ~/nexus-fe'
          scp -P "$VPS_PORT" deploy/compose.yaml "$target:~/nexus-fe/compose.yaml"
          printf 'FRONTEND_IMAGE=%s\nAPI_GATEWAY_URL=%s\n' "$image" "$API_GATEWAY_URL" | ssh -p "$VPS_PORT" "$target" 'umask 077; cat > ~/nexus-fe/.env'
          printf '%s' "$GHCR_READ_TOKEN" | ssh -p "$VPS_PORT" "$target" "set -eu; docker login ghcr.io -u '$GHCR_READ_USER' --password-stdin; trap 'docker logout ghcr.io' EXIT; cd ~/nexus-fe; docker compose --env-file .env -f compose.yaml pull; docker compose --env-file .env -f compose.yaml up -d --remove-orphans --wait --wait-timeout 120"
